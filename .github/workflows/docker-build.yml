name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']          # publishing a Release/tag like v1.8.0 builds a versioned image
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Job 1: Integration tests ─────────────────────────────────────────────────
  test:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, curl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run integration tests
        run: php tests/run.php

  # ── Job 2: Docker build + push to GHCR (runs only after tests pass) ──────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate to GHCR using the built-in token — no extra secrets needed.
      # Skipped on pull requests (no push), where GITHUB_TOKEN is read-only.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}        # v1.8.0 -> 1.8.0
            type=semver,pattern={{major}}.{{minor}} # v1.8.0 -> 1.8
            type=semver,pattern={{major}}           # v1.8.0 -> 1

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Push only when not a PR (PRs just verify the build succeeds)
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
